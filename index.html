<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply a saved light/dark override before first paint (see src/colorScheme.js).
      try {
        var scheme =
          localStorage.getItem('pokedev-color-scheme') || localStorage.getItem('mantine-color-scheme-value');
        if (scheme === 'light' || scheme === 'dark') {
          document.querySelector('meta[name="color-scheme"]').content = scheme;
        }
      } catch (e) {}
    </script>
    <title>PokéDev · A Modern Pokédex</title>
    <meta name="description" content="PokéDev — a fast Pokédex built with React, Vite, and PokéAPI data." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M 4 50 A 46 46 0 0 1 96 50 Z' fill='%23c91c15'/><path d='M 4 50 A 46 46 0 0 0 96 50 Z' fill='%23ffffff'/><circle cx='50' cy='50' r='46' fill='none' stroke='%2315181d' stroke-width='7'/><line x1='4' y1='50' x2='96' y2='50' stroke='%2315181d' stroke-width='7'/><circle cx='50' cy='50' r='14' fill='%23ffffff' stroke='%2315181d' stroke-width='7'/><circle cx='50' cy='50' r='5.5' fill='%2315181d'/></svg>" />
    <link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-500.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Full-size artwork for the detail view comes from GitHub. -->
    <link rel="dns-prefetch" href="https://raw.githubusercontent.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
